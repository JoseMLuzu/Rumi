info:
  name: Room directory
  type: http
  seq: 10
http:
  method: GET
  url: "{{baseUrl}}/api/rooms"
runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.rooms
      operator: isArray
docs: Run Initialize visitor first. Returns room IDs/names for visiting without exposing visitor cookie IDs.
