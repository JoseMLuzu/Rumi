info:
  name: Load central room
  type: http
  seq: 2
http:
  method: GET
  url: "{{baseUrl}}/api/rooms/1"
runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.id
      operator: eq
      value: "1"
    - expression: res.body.items
      operator: isArray
docs: Reads the shared central room. Its furniture is preserved and visitors cannot edit it.
